#
# 推到 main 或开 PR 就构建、自检，产物挂在这次运行的 Artifacts 里；
# 推 v* 标签时额外发 Release。不想用 CI 的话删掉这个文件即可，
# release.sh 在本地一样能跑完全套。
#
# 签名：仓库 Secrets 里放「MacToAndroid Local Signing」证书，每个版本签名就一致，
# 用户更新后不用重新授权：
#   SIGNING_CERT_P12           证书连同私钥导出的 .p12，base64 编码（base64 -i cert.p12）
#   SIGNING_CERT_P12_PASSWORD  导出时设的密码
# 没有这两个 Secret（比如外部仓库发来的 PR）时退回 ad-hoc 签名。
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时只保留最新一次构建；标签构建不取消，免得半途丢掉一次发布
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 标签和 build.sh 里的 VERSION 对不上就直接失败：
      # release.sh 是按 VERSION 命名产物的，不一致会发出一个名字对不上标签的包
      - name: 核对标签与版本号
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' build.sh | head -1)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "标签 v$TAG 与 build.sh 里的 VERSION=$VERSION 不一致" >&2
            exit 1
          fi

      - name: 导入签名证书
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "::warning::Secrets 里没有签名证书，改用 ad-hoc 签名"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"; pw=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=MacToAndroid Local Signing" >> "$GITHUB_ENV"

      - name: 构建并打包
        run: ./release.sh

      # cask 必须跟着 zip 一起出去。它里面的 sha256 算的是**这次 CI 构建的那个 zip**，
      # 而 runner 的 Xcode 版本和本机未必一致，二进制不同、sha256 就不同——
      # 事后在本地重跑 release.sh 得到的 cask 配不上 Release 上挂的包，
      # 用户 brew install 时直接卡在校验失败上。所以不能只留在 runner 里。
      - uses: actions/upload-artifact@v4
        with:
          name: MacToAndroid
          path: |
            dist/MacToAndroid-*.zip
            dist/mactoandroid.rb

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/MacToAndroid-$V.zip" "dist/mactoandroid.rb" \
            --title "MacToAndroid $V" --notes-file dist/RELEASE-NOTES.md
